    --r1:#232B3A; --r1i:#C4CBD8; --r5:#33405A; --r5i:#E6E9EF; --r7:#4B5D8F; --r7i:#FFFFFF; --r8:#6478B5; --r9:#8496D6; --r10:#B4C2F5;
    --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#181E28; --sunk:#141922; --ink:#E6E9EF; --muted:#9AA3B3; --faint:#6E7889; --rule:#29313F;
  --accent:#C9D2F2; --accent-ink:#141A2B; --focus:#8EA5FF; --danger:#E06A7C; --ok:#4CC08C;
  --c-film:#D0435F; --c-series:#14A595; --c-cartoon:#C08314; --c-anime:#6C70F0;
  --r1:#232B3A; --r1i:#C4CBD8; --r5:#33405A; --r5i:#E6E9EF; --r7:#4B5D8F; --r7i:#FFFFFF; --r8:#6478B5; --r9:#8496D6; --r10:#B4C2F5;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-feature-settings:'lnum';-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 22px 18px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px;text-decoration:none}
.brand-mark{display:flex;gap:2px;height:22px;align-items:stretch}
.brand-mark i{display:block;width:3px;border-radius:1px}
.brand-mark i:nth-child(1){background:var(--c-film)}
.brand-mark i:nth-child(2){background:var(--c-series);width:2px}
.brand-mark i:nth-child(3){background:var(--c-cartoon);width:4px}
.brand-mark i:nth-child(4){background:var(--c-anime)}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sep{height:1px;background:var(--rule);margin:10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.nav .dot{width:4px;height:16px;border-radius:2px;background:var(--faint);flex:none}
.nav .n{margin-left:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--faint);padding:0 8px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--rule)}
.top-row{display:flex;align-items:center;gap:10px;padding:14px 32px;max-width:1040px}
.top .brand{display:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 12px;min-width:0;max-width:440px}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;min-width:0}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.savestate{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto}
.savestate .led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savestate.busy .led{background:var(--c-cartoon)}
.savestate.err{color:var(--danger)}.savestate.err .led{background:var(--danger)}
.tabs{display:none}
.content{padding:8px 32px 80px;max-width:1040px;width:100%}

/* ---------- кнопки, поля ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.icon{padding:8px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.input,.select,textarea.input{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 12px;outline:none}
textarea.input{resize:vertical;min-height:76px;line-height:1.5}
.input:focus,.select:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7}

/* ---------- заголовки ---------- */
h1,h2,h3{margin:0;font-weight:700}
.h1{font-family:var(--display);font-size:30px;line-height:1.15;letter-spacing:-.015em;font-weight:700}
.h2{font-family:var(--display);font-size:18px;line-height:1.25;letter-spacing:-.005em;font-weight:600}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:18px 0 18px;flex-wrap:wrap}
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}

/* ---------- лента-штрихкод ---------- */
.hero{padding:22px 0 8px}
.hero .h1{font-size:34px;max-width:20ch}
.reel{margin-top:22px;position:relative;user-select:none;-webkit-user-select:none}
.reel svg{display:block;width:100%;height:120px;touch-action:pan-y;border-radius:10px;border:1px solid var(--rule);background:var(--surface);cursor:crosshair}
.reel-bg{fill:var(--surface)} .reel-grid{fill:var(--rule)}
.k-film{fill:var(--c-film)} .k-series{fill:var(--c-series)} .k-cartoon{fill:var(--c-cartoon)} .k-anime{fill:var(--c-anime)}
.reel .years{position:relative;height:22px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.reel .years span{position:absolute;top:6px;transform:translateX(2px)}
.reel .cursor{position:absolute;top:-5px;width:3px;height:130px;background:var(--ink);pointer-events:none;display:none;border-radius:1px;box-shadow:0 0 0 1px var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:14px}
.legend a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted)}
.legend a:hover{color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.35;max-width:260px;box-shadow:var(--shadow);display:none}
.tip b{display:block;font-weight:600}
.tip.clickable{pointer-events:auto;cursor:pointer}

.nudge{display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;margin-top:28px}
.nudge p{margin:4px 0 0;color:var(--muted)}
.nudge .acts{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:10px;max-width:420px;box-shadow:inset 0 0 0 1px var(--rule)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--sunk);border:1px dashed var(--rule);margin-top:16px;font-size:14px}

/* ---------- списки ---------- */
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.toolbar .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .search{max-width:none;flex:1 1 240px}
.toolbar .select{width:auto;flex:none}
.subtabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--rule);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.subtabs button{border:0;background:none;border-radius:8px;padding:6px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--rule)}
.subtabs .n{font-size:12.5px;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.ygroup{display:flex;align-items:baseline;gap:10px;padding:18px 16px 8px;font-family:var(--display);font-size:15px;font-weight:600;background:var(--sunk);border-bottom:1px solid var(--rule)}
.ygroup .n{font-family:var(--font);font-size:13px;color:var(--faint);font-weight:400}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 16px 11px 12px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.spine{align-self:stretch;border-radius:2px;background:var(--c,var(--faint));min-height:30px}
.r-title{display:block;font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.r-sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:3px}
.r-sub .st{display:inline-flex;align-items:center;gap:4px}
.r-sub .heart{color:var(--c-film)}
.r-verdict{display:block;font-size:13.5px;color:var(--ink);margin-top:4px;opacity:.85;font-style:italic;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:9px;font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.badge.none{color:var(--faint);border:1px dashed var(--rule);font-family:var(--font);font-weight:500}
.badge.avg{font-size:13px;border:1px solid var(--rule);color:var(--muted);background:none}
.rv1,.rv2,.rv3,.rv4,.stars .rv1,.stars .rv2,.stars .rv3,.stars .rv4{background:var(--r1);color:var(--r1i)}
.rv5,.rv6,.stars .rv5,.stars .rv6{background:var(--r5);color:var(--r5i)}
.rv7,.stars .rv7{background:var(--r7);color:var(--r7i)}
.rv8,.stars .rv8{background:var(--r8);color:#fff}
.rv9,.stars .rv9{background:var(--r9);color:#fff}
.rv10,.stars .rv10{background:var(--r10);color:#fff}
:root[data-theme="dark"] .rv9,:root[data-theme="dark"] .rv10,:root[data-theme="dark"] .stars .rv9,:root[data-theme="dark"] .stars .rv10{color:#10141B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rv9,:root:not([data-theme="light"]) .rv10,:root:not([data-theme="light"]) .stars .rv9,:root:not([data-theme="light"]) .stars .rv10{color:#10141B}}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .h2{color:var(--ink);margin-bottom:6px}
.more{display:flex;justify-content:center;padding:14px}

/* ---------- карточка тайтла ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.36);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:50;box-shadow:none;transform:translateX(102%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s linear .22s,box-shadow 0s linear .22s;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.drawer.on{transform:none;visibility:visible;box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.d-bar{height:5px;background:var(--c,var(--faint));flex:none}
.d-top{display:flex;align-items:center;gap:6px;padding:10px 12px 0 20px;flex:none}
.d-top .crumb{font-size:13px;color:var(--muted);margin-right:auto}
.d-body{overflow:auto;padding:6px 24px 40px;flex:1;overscroll-behavior:contain}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;margin-bottom:6px}
.d-title{font-family:var(--display);font-size:24px;line-height:1.2;letter-spacing:-.01em;font-weight:700;overflow-wrap:anywhere}
.d-orig{color:var(--muted);margin-top:6px;font-size:14.5px}
.poster{width:92px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--sunk);border:1px solid var(--rule)}
.d-sec{margin-top:26px}
.d-sec>.lbl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:10px}
.d-sec>.lbl small{font-weight:400;color:var(--faint);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px;color:var(--muted)}
.seg button:hover{color:var(--ink);border-color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.stars button{height:42px;border:1px solid var(--rule);background:var(--surface);border-radius:9px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.stars button:hover{border-color:var(--faint);color:var(--ink)}
.stars button[aria-pressed="true"]{border-color:transparent}
.rword{display:flex;align-items:baseline;gap:12px;margin-top:10px;min-height:24px}
.rword b{font-family:var(--display);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.parts{border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.part{padding:12px 14px;border-bottom:1px solid var(--rule)}
.part:last-child{border-bottom:0}
.part-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.plabel{font-family:var(--display);font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--rule);white-space:nowrap}
.ptitle{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pmeta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:4px 10px;flex-wrap:wrap}
.part-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.part-c .select{padding-top:7px;padding-bottom:7px;font-size:14px}
.part textarea.input{min-height:40px;margin-top:8px;font-size:14px;padding:8px 10px}
.addpart{padding:14px;background:var(--sunk);display:grid;gap:10px}
.addpart .grid{display:grid;grid-template-columns:150px 110px 1fr;gap:8px}
.addpart .grid.g2{grid-template-columns:110px 1fr}
.ext{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ext .score{display:inline-flex;align-items:baseline;gap:8px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px}
.ext .score b{font-family:var(--display);font-size:17px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.dates span{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 4px 3px 9px;border:1px solid var(--rule);border-radius:999px}
.dates span button{border:0;background:none;color:var(--faint);padding:0 4px;line-height:1}
.dates span button:hover{color:var(--danger)}
.date-list{display:grid;gap:6px;max-width:330px}
.date-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.date-row .input{padding:7px 10px}
.part-dates{margin-top:10px;padding:12px;border-radius:10px;background:var(--sunk);border:1px solid var(--rule)}
.d-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--rule);background:var(--surface);flex:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* ---------- модальное окно ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(10,14,22,.4);overflow:auto}
.modal.on{display:flex}
.modal-box{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);padding:22px 22px 18px;display:grid;gap:14px;border:1px solid var(--rule)}
.modal-box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ---------- статистика ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 14px}
.ybars{display:grid;gap:8px;margin-top:10px}
.ybar{display:grid;grid-template-columns:44px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:13.5px}
.ybar .track{display:flex;gap:2px;height:22px;min-width:0}
.ybar .track i{display:block;height:100%;border-radius:4px;min-width:3px}
.ybar .t{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;height:160px;margin-top:14px}
.hist .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.hist .col i{display:block;width:100%;max-width:38px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.hist-x{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;text-align:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:6px;font-family:var(--display)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--rule)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- данные / инструкция ---------- */
.steps{counter-reset:s;display:grid;gap:0;margin:14px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}

<script id="code-gs" type="text/plain">// Кинодневник — хранилище записей в этой Google-таблице.
// Ничего здесь менять не нужно, кроме ключа ниже (его вписывает Claude).

const KEY = 'PASTE_KEY_HERE';
const SHEET_NAME = 'Каталог';
const HEAD = ['id', 'Раздел', 'Название', 'Оригинал', 'Год', 'Статус', 'Оценка', 'Вердикт', 'Обновлено', 'data (не редактировать)'];
const CAT = { film: 'Фильм', series: 'Сериал', cartoon: 'Мультфильм', toon: 'Мультсериал', anime: 'Аниме', animefilm: 'Аниме-фильм' };
const ST = { done: 'Просмотрено', watching: 'Смотрю', paused: 'На паузе', dropped: 'Брошено', planned: 'Хочу посмотреть' };

function doGet() { return out_({ ok: true, app: 'kinodnevnik' }); }

function doPost(e) {
  let req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, error: 'неверный запрос' }); }
  if (!req || req.key !== KEY) return out_({ ok: false, error: 'неверный ключ' });
  const fns = { getAll: getAll, saveItems: saveItems, deleteItems: deleteItems, replaceAll: replaceAll };
  if (!fns[req.action]) return out_({ ok: false, error: 'неизвестное действие' });
  try { return out_({ ok: true, data: fns[req.action](req.arg) }); }
  catch (err) { return out_({ ok: false, error: String((err && err.message) || err) }); }
}

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function sheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET_NAME);
  if (!sh) {
    sh = ss.insertSheet(SHEET_NAME, 0);
    sh.getRange(1, 1, 1, HEAD.length).setValues([HEAD]).setFontWeight('bold');
    sh.setFrozenRows(1);
    sh.setColumnWidth(3, 280);
  }
  return sh;
}

function row_(it) {
  const data = JSON.stringify(it);
  if (data.length > 49000) throw new Error('запись «' + it.title + '» слишком длинная для одной ячейки, сократи заметки');
  return [it.id, CAT[it.cat] || it.cat, it.title || '', it.orig || '', it.year || '', ST[it.status] || '',
          it.rating || '', it.verdict || '', new Date(), data];
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try { return fn(); } finally { lock.releaseLock(); }
}

function getAll() {
  const sh = sheet_();
  const n = sh.getLastRow() - 1;
  if (n < 1) return JSON.stringify({ items: [] });
  const vals = sh.getRange(2, HEAD.length, n, 1).getValues();
  const items = [];
  vals.forEach(function (r) { if (r[0]) { try { items.push(JSON.parse(r[0])); } catch (e) {} } });
  return JSON.stringify({ items: items });
}

function saveItems(json) {
  const list = JSON.parse(json);
  return withLock_(function () {
    const sh = sheet_();
    const n = sh.getLastRow() - 1;
    const ids = n > 0 ? sh.getRange(2, 1, n, 1).getValues().map(function (r) { return String(r[0]); }) : [];
    const pos = {};
    ids.forEach(function (id, i) { pos[id] = i + 2; });
    const add = [];
    list.forEach(function (it) {
      const r = row_(it);
      if (pos[it.id] > 0) sh.getRange(pos[it.id], 1, 1, r.length).setValues([r]);
      else { add.push(r); pos[it.id] = -1; }
    });
    if (add.length) sh.getRange(sh.getLastRow() + 1, 1, add.length, HEAD.length).setValues(add);
    return 'ok';
  });
}

function deleteItems(json) {
  const del = {};
  JSON.parse(json).forEach(function (id) { del[id] = true; });
  return withLock_(function () {
    const sh = sheet_();
    const n = sh.getLastRow() - 1;
    if (n < 1) return 'ok';
    const ids = sh.getRange(2, 1, n, 1).getValues();
    for (let i = ids.length - 1; i >= 0; i--) {
      if (del[String(ids[i][0])]) {
        if (sh.getLastRow() > 2) sh.deleteRow(i + 2);
        else sh.getRange(i + 2, 1, 1, HEAD.length).clearContent();
      }
    }
    return 'ok';
  });
}

function replaceAll(json) {
  const rows = JSON.parse(json).map(row_);
  return withLock_(function () {
    const sh = sheet_();
    const n = sh.getLastRow() - 1;
    if (n > 0) sh.getRange(2, 1, n, HEAD.length).clearContent();
    if (rows.length) sh.getRange(2, 1, rows.length, HEAD.length).setValues(rows);
    return 'ok';
  });
}

<script id="app-js">(function () {
'use strict';

/* ================= Константы ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const KEY_REMOTE = 'kinodnevnik:remote';
const KEY_ITEMS = 'kinodnevnik:items', KEY_META = 'kinodnevnik:meta', KEY_THEME = 'kinodnevnik:theme';

const CATS = {
  film:      { one: 'Фильм',        many: 'Фильмы',        group: 'film' },
  series:    { one: 'Сериал',       many: 'Сериалы',       group: 'series' },
  cartoon:   { one: 'Мультфильм',   many: 'Полнометражные', group: 'cartoon' },
  toon:      { one: 'Мультсериал',  many: 'Мультсериалы',  group: 'cartoon' },
  anime:     { one: 'Аниме-сериал', many: 'Аниме-сериалы', group: 'anime' },

};
const GROUPS = {

  anime:   { name: 'Аниме',       cats: ['anime', 'animefilm'], sub: [['anime', 'Сериалы'], ['animefilm', 'Фильмы']] }
};
const GROUP_ORDER = ['film', 'series', 'cartoon', 'anime'];
const STATUS = {
  done:     { label: 'Просмотрено', icon: 'check' },
  watching: { label: 'Смотрю', icon: 'play' },

  dropped:  { label: 'Брошено', icon: 'x' },
  planned:  { label: 'Хочу посмотреть', icon: 'bookmark' }
};
const STATUS_ORDER = ['done', 'watching', 'paused', 'dropped', 'planned'];
const WORDS = ['', 'Ужасно', 'Очень плохо', 'Плохо', 'Слабо', 'Средне', 'Неплохо', 'Хорошо', 'Отлично', 'Великолепно', 'Шедевр'];
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const VIEWS = ['home', 'film', 'series', 'cartoon', 'anime', 'watchlist', 'stats', 'data', 'search'];

const P = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>',

  x: '<path d="M17 7 7 17M7 7l10 10"/>',
  bookmark: '<path d="M7 4h10v16l-5-4-5 4z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  heartF: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/>',
  repeat: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  thumb: '<path d="M7 11v9H4v-9z"/><path d="M7 11l4-8a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  download: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  upload: '<path d="M12 16V5"/><path d="m7 10 5-5 5 5"/><path d="M5 20h14"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  cloud: '<path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
  next: '<path d="m9 6 6 6-6 6"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  star: '<path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/>'
};
const I = (n, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || '') + '</svg>';

/* ================= Утилиты ================= */
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = (iso, withYear = true) => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return +d + ' ' + MONTHS[+m - 1] + (withYear ? ' ' + y : ''); };
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : b === 1 ? 0 : (b >= 2 && b <= 4) ? 1 : 2]; };
const fold = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"'.,:;!?()\[\]\-–—/]/g, ' ').replace(/\s+/g, ' ').trim();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const year4 = y => (String(y || '').match(/\d{4}/) || [''])[0];
const groupOf = it => (CATS[it.cat] || CATS.film).group;
const lastDate = it => it.dates && it.dates.length ? it.dates[it.dates.length - 1] : '';
const isMulti = it => Array.isArray(it.parts) && it.parts.length > 0;
const isSeriesLike = it => ['series', 'toon', 'anime'].includes(it.cat);
function partsAvg(it) {
  const r = (it.parts || []).map(p => p.rating).filter(Boolean);
  return r.length ? r.reduce((a, b) => a + b, 0) / r.length : null;
}
function deriveStatus(parts) {
  if (parts.some(p => p.status === 'watching')) return 'watching';
  if (parts.some(p => p.status === 'paused')) return 'paused';
  const seen = parts.filter(p => p.status !== 'planned');
  if (!seen.length) return 'planned';
  if (seen.every(p => p.status === 'done')) return 'done';
  if (seen.every(p => p.status === 'dropped')) return 'dropped';
  return seen[seen.length - 1].status === 'dropped' ? 'dropped' : 'done';
}
function syncParts(it) {
  if (!isMulti(it)) return;
  it.dates = Array.from(new Set(it.parts.flatMap(p => p.dates || []))).sort();
  it.status = deriveStatus(it.parts);
}
function partsSummary(it) {
  if (!isMulti(it)) return '';
  const c = { tv: 0, film: 0, ova: 0 };
  it.parts.forEach(p => { c[p.kind === 'film' ? 'film' : p.kind === 'tv' ? 'tv' : 'ova']++; });
  const out = [];
  if (c.tv) out.push(c.tv + ' ' + plural(c.tv, ['сезон', 'сезона', 'сезонов']));
  if (c.film) out.push(c.film + ' ' + plural(c.film, ['фильм', 'фильма', 'фильмов']));
  if (c.ova) out.push(c.ova + ' OVA');
  return out.join(', ');
}
function norm(it) {
  if (!it || typeof it !== 'object') return null;
  if (!it.id) it.id = uid('x');
  if (!CATS[it.cat]) it.cat = 'film';
  it.title = String(it.title || 'Без названия');
  if (!STATUS[it.status]) it.status = 'done';
  it.dates = Array.isArray(it.dates) ? it.dates.filter(Boolean).sort() : [];
  if (it.rating != null) { it.rating = +it.rating || null; if (it.rating && (it.rating < 1 || it.rating > 10)) it.rating = null; }
  if (Array.isArray(it.parts)) {
    it.parts = it.parts.filter(Boolean);
    it.parts.forEach(p => {
      if (!p.id) p.id = uid('p');
      if (!STATUS[p.status]) p.status = 'done';
      p.dates = Array.isArray(p.dates) ? p.dates.filter(Boolean).sort() : [];
      if (p.rating != null) p.rating = +p.rating || null;
    });
    if (!it.parts.length) delete it.parts;
  }
  return it;
}

/* ================= Состояние ================= */
const S = { items: [], byId: new Map(), seed: { items: [] }, meta: {}, ready: false };
const UI = {
  view: 'home', open: null, q: '', sub: 'all', status: 'all', extra: '', sort: 'date',
  showAll: {}, partDates: {}, editBasics: false, addPart: false, confirmDel: false, confirmPart: null, pushed: false, pendingImport: null
};
function reindex() { S.byId = new Map(S.items.map(it => [it.id, it])); }

/* ================= Хранилище ================= */
const isGoogle = () => typeof google !== 'undefined' && google.script && google.script.run;
const Store = {
  mode: 'local', ok: true, dirty: new Set(), deleted: new Set(), timer: null, busy: false, failed: false,
  remote: null,
  async run(fn, arg) {
    if (this.remote) {
      let r;
      try {
        r = await fetch(this.remote.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: this.remote.key, action: fn, arg: arg }), redirect: 'follow' });
      } catch (e) { throw new Error('нет связи с таблицей'); }
      let j; try { j = await r.json(); } catch (e) { throw new Error('таблица ответила странно (' + r.status + ')'); }
      if (!j.ok) throw new Error(j.error || 'ошибка таблицы');
      return j.data;
    }
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg));
  },
  async load() {
    const rem = LS.get(KEY_REMOTE, null);
    if (!isGoogle() && rem && rem.url && rem.key) this.remote = rem;
    if (isGoogle() || this.remote) {
      this.mode = 'google';
      const r = JSON.parse(await this.run('getAll'));
      return r.items || [];
    }
    this.mode = 'local';
    const test = LS.set('kinodnevnik:test', 1);
    this.ok = test;
    return LS.get(KEY_ITEMS, null);
  },
  touch(it) {
    it.updated = new Date().toISOString();
    S.meta.lastChange = it.updated; saveMeta();
    this.dirty.add(it.id);
    this.schedule();
  },
  remove(id) { this.deleted.add(id); this.dirty.delete(id); S.meta.lastChange = new Date().toISOString(); saveMeta(); this.schedule(); },
  schedule() {
    clearTimeout(this.timer);
    setSave('busy');
    this.timer = setTimeout(() => this.flush(), this.mode === 'google' ? 1100 : 350);
  },
  pending() { return this.dirty.size > 0 || this.deleted.size > 0 || this.busy; },
  async flush() {
    if (this.mode === 'local') {
      this.dirty.clear(); this.deleted.clear();
      const ok = LS.set(KEY_ITEMS, S.items);
      this.ok = ok;
      setSave(ok ? 'ok' : 'err', ok ? '' : 'Браузер не сохранил изменения');
      return;
    }
    if (this.busy) { this.schedule(); return; }
    const ids = Array.from(this.dirty), dels = Array.from(this.deleted);
    this.dirty.clear(); this.deleted.clear();
    this.busy = true;
    try {
      const list = ids.map(id => S.byId.get(id)).filter(Boolean);
      if (list.length) await this.run('saveItems', JSON.stringify(list));
      if (dels.length) await this.run('deleteItems', JSON.stringify(dels));
      this.failed = false;
      setSave('ok');
    } catch (e) {
      ids.forEach(id => this.dirty.add(id)); dels.forEach(id => this.deleted.add(id));
      this.failed = true;
      setSave('err', (e && e.message) ? 'Не сохранилось: ' + e.message : 'Нет связи, повторю');
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 6000);
    } finally { this.busy = false; }
  },
  async replaceAll(items) {
    S.items = items.map(norm).filter(Boolean); reindex();
    S.meta.lastChange = new Date().toISOString(); saveMeta();
    if (this.mode === 'google') {
      setSave('busy');
      await this.run('replaceAll', JSON.stringify(S.items));
      setSave('ok');
    } else {
      const ok = LS.set(KEY_ITEMS, S.items); this.ok = ok; setSave(ok ? 'ok' : 'err');
    }
  }
};
function saveMeta() { if (Store.mode === 'local') LS.set(KEY_META, S.meta); }
function setSave(state, msg) {
  const el = $('#savestate'); if (!el) return;
  el.className = 'savestate' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : '');
  const where = Store.mode === 'google' ? 'в Google' : 'в браузере';
  el.innerHTML = '<span class="led"></span><span>' + esc(state === 'busy' ? 'Сохраняю…' : state === 'err' ? (msg || 'Ошибка сохранения') : 'Сохранено ' + where) + '</span>';

let REEL = null;
function mountReel() {
  const svg = $('#reelsvg'); if (!svg) return;
  const ev = viewEvents();
  if (!ev.length) { $('#reel').style.display = 'none'; return; }
  const y0 = +ev[0].d.slice(0, 4), y1 = Math.max(+ev[ev.length - 1].d.slice(0, 4), new Date().getFullYear());
  const t0 = Date.UTC(y0, 0, 1), t1 = Date.UTC(y1 + 1, 0, 1);
  const W = 1000, H = 100;
  const px = svg.getBoundingClientRect().width || 800;
  const w = Math.max(1.4, 1.6 * W / px);
  const xs = ev.map(e => { const [y, m, d] = e.d.split('-'); return (Date.UTC(+y, +m - 1, +d) - t0) / (t1 - t0) * W; });
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'none');
  let s = '<rect x="0" y="0" width="' + W + '" height="' + H + '" class="reel-bg"/>';
  for (let y = y0 + 1; y <= y1; y++) { const x = (Date.UTC(y, 0, 1) - t0) / (t1 - t0) * W; s += '<rect x="' + x.toFixed(2) + '" y="0" width="' + (W / px).toFixed(3) + '" height="' + H + '" class="reel-grid"/>'; }
  ev.forEach((e, i) => { s += '<rect x="' + (xs[i] - w / 2).toFixed(2) + '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" class="k-' + e.g + '"/>'; });
  svg.innerHTML = s;
  let yl = '';
  for (let y = y0; y <= y1; y++) { const x = (Date.UTC(y, 0, 1) - t0) / (t1 - t0) * 100; yl += '<span style="left:' + x.toFixed(2) + '%">' + y + '</span>'; }
  $('#reelyears').innerHTML = yl;
  REEL = { ev, xs, W };
}
function reelPick(clientX) {
  const svg = $('#reelsvg'); if (!svg || !REEL) return null;
  const r = svg.getBoundingClientRect();
  const x = (clientX - r.left) / r.width * REEL.W;
  let best = -1, bd = Infinity;
  for (let i = 0; i < REEL.xs.length; i++) { const d = Math.abs(REEL.xs[i] - x); if (d < bd) { bd = d; best = i; } }
  const tol = 10 / r.width * REEL.W;
  if (best < 0 || bd > tol) return null;
  // при совпадении дат берём последнюю из группы
  return { i: best, x: r.left + REEL.xs[best] / REEL.W * r.width, r };
}
function showReelTip(clientX, clientY, sticky) {
  const pk = reelPick(clientX), tip = $('#tip'), cur = $('#reelcur');
  if (!pk) { hideTip(); return null; }
  const e = REEL.ev[pk.i];
  const same = REEL.ev.filter(o => o.d === e.d);
  tip.innerHTML = same.slice(0, 4).map(o => '<b>' + esc(o.label) + '</b>').join('') + (same.length > 4 ? '<span>и ещё ' + (same.length - 4) + '</span><br>' : '') + '<span>' + esc(fmtDate(e.d)) + (sticky ? ', нажми, чтобы открыть' : '') + '</span>';
  tip.style.display = 'block';
  tip.classList.toggle('clickable', !!sticky);
  tip.dataset.id = e.it.id;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(8, pk.x - tw / 2), innerWidth - tw - 8);
  let top = pk.r.top - th - 10; if (top < 8) top = pk.r.bottom + 10;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  cur.style.display = 'block'; cur.style.left = (pk.x - pk.r.left - 1.5) + 'px';
  return e;
}

function listHTML(list, key, byYear) {

/* ================= Статистика ================= */
function viewStats() {
  const ev = viewEvents();
  const seen = S.items.filter(it => it.status !== 'planned');
  const rated = seen.filter(it => it.rating);
  const avg = rated.length ? rated.reduce((a, b) => a + b.rating, 0) / rated.length : null;
  const years = {};
  ev.forEach(e => { const y = e.d.slice(0, 4); (years[y] = years[y] || { film: 0, series: 0, cartoon: 0, anime: 0, n: 0 }); years[y][e.g]++; years[y].n++; });
  const ys = Object.keys(years).sort();
  const maxY = Math.max(1, ...ys.map(y => years[y].n));
  let h = '<div class="page-head"><div><h1 class="h1">Статистика</h1><p class="lead">Считается по датам просмотров и по твоим оценкам.</p></div></div>';
  h += '<div class="stat-grid">' +
    tile(ev.length, 'просмотров всего') + tile(seen.length, 'тайтлов в дневнике') + tile(rated.length, 'с твоей оценкой') + tile(avg ? avg.toFixed(1).replace('.', ',') : '–', 'средняя оценка') + '</div>';
  h += '<section class="section"><div class="panel"><div class="section-head"><h2 class="h2">Просмотры по годам</h2></div>' +
    '<div class="legend" style="margin-top:0">' + GROUP_ORDER.map(g => '<span style="display:inline-flex;align-items:center;gap:8px;color:var(--muted)"><i style="background:var(--c-' + g + ')"></i>' + GROUPS[g].name + '</span>').join('') + '</div>' +
    '<div class="ybars">' + ys.map(y => '<div class="ybar"><span class="num">' + y + '</span><span class="track">' +
      GROUP_ORDER.filter(g => years[y][g]).map(g => '<i data-tip="' + esc(GROUPS[g].name + ' в ' + y + ' году: ' + years[y][g]) + '" style="width:calc((100% - 6px) * ' + (years[y][g] / maxY).toFixed(4) + ');background:var(--c-' + g + ')"></i>').join('') +
      '</span><span class="t">' + years[y].n + '</span></div>').join('') + '</div>' +
    '<details style="margin-top:12px"><summary class="faint" style="cursor:pointer;font-size:13.5px">Показать таблицей</summary><table class="t" style="margin-top:8px"><thead><tr><th>Год</th>' + GROUP_ORDER.map(g => '<th>' + GROUPS[g].name + '</th>').join('') + '<th>Всего</th></tr></thead><tbody>' +
      ys.map(y => '<tr><td>' + y + '</td>' + GROUP_ORDER.map(g => '<td>' + years[y][g] + '</td>').join('') + '<td>' + years[y].n + '</td></tr>').join('') + '</tbody></table></details></div></section>';
  // оценки
  h += '<section class="section"><div class="cols2"><div class="panel"><div class="section-head"><h2 class="h2">Мои оценки</h2><span class="faint num">' + rated.length + '</span></div>';
  if (rated.length < 3) {
    h += '<p class="muted">Здесь появится распределение оценок, когда оценишь хотя бы три тайтла.</p><button class="btn" data-act="next-unrated">' + I('star') + 'Оценить последнее</button>';
  } else {
    const hist = Array(11).fill(0); rated.forEach(it => hist[it.rating]++);
    const mx = Math.max(...hist);
    h += '<div class="hist">' + hist.slice(1).map((n, i) => '<div class="col"><span class="num">' + (n || '') + '</span><i data-tip="' + (i + 1) + ', ' + WORDS[i + 1].toLowerCase() + ': ' + n + '" style="height:' + (n / mx * 100).toFixed(1) + '%"></i></div>').join('') + '</div>' +
      '<div class="hist-x">' + hist.slice(1).map((n, i) => '<span>' + (i + 1) + '</span>').join('') + '</div>';
  }
  h += '</div><div class="panel"><div class="section-head"><h2 class="h2">По разделам</h2></div><table class="t"><thead><tr><th>Раздел</th><th>Тайтлов</th><th>Оценено</th><th>Средняя</th></tr></thead><tbody>' +
    GROUP_ORDER.map(g => {
      const l = seen.filter(it => groupOf(it) === g), r = l.filter(it => it.rating);
      const a = r.length ? (r.reduce((x, y) => x + y.rating, 0) / r.length).toFixed(1).replace('.', ',') : '–';
      return '<tr><td>' + GROUPS[g].name + '</td><td>' + l.length + '</td><td>' + r.length + '</td><td>' + a + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<table class="t" style="margin-top:14px"><thead><tr><th>Статус</th><th>Тайтлов</th></tr></thead><tbody>' +
    STATUS_ORDER.map(s => '<tr><td>' + STATUS[s].label + '</td><td>' + S.items.filter(it => it.status === s).length + '</td></tr>').join('') + '</tbody></table></div></div></section>';
  const top = rated.slice().sort((a, b) => b.rating - a.rating || lastDate(b).localeCompare(lastDate(a))).slice(0, 10);
  if (top.length) h += '<section class="section"><div class="section-head"><h2 class="h2">Лучшее по моим оценкам</h2></div><div class="list">' + top.map(it => rowHTML(it, { showCat: true, fullDate: true })).join('') + '</div></section>';
  const favs = S.items.filter(it => it.fav);
  if (favs.length) h += '<section class="section"><div class="section-head"><h2 class="h2">Любимое</h2><span class="faint num">' + favs.length + '</span></div><div class="list">' + sortItems(favs, 'rating').map(it => rowHTML(it, { showCat: true, fullDate: true })).join('') + '</div></section>';
  const rew = S.items.filter(it => !isMulti(it) && !isSeriesLike(it) && it.dates.length > 1).sort((a, b) => b.dates.length - a.dates.length);
  if (rew.length) h += '<section class="section"><div class="section-head"><h2 class="h2">Пересматривал</h2><span class="faint num">' + rew.length + '</span></div><div class="list">' + rew.map(it => rowHTML(it, { showCat: true, fullDate: true })).join('') + '</div></section>';
  return h;
}

function submitAdd(form) {

  const cat = f.get('cat'), status = f.get('status');

function exportJSON() {
  const data = JSON.stringify({ app: 'kinodnevnik', version: 1, exported: new Date().toISOString(), items: S.items }, null, 1);
  if (download('kinodnevnik-' + today() + '.json', data, 'application/json')) {

    toast('Резервная копия скачана');
    if (UI.view === 'home' || UI.view === 'data') renderMain();
  } else {
    copyText(data).then(ok => toast(ok ? 'Скачать не вышло, копия скопирована в буфер обмена' : 'Не получилось сохранить копию'));
  }
}
function buildPage(withData) {
  const css = $('#app-css') ? $('#app-css').textContent : '';

  return '<!DOCTYPE html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Кинодневник</title>\n' +

function exportHTML() {

    S.meta.lastBackup = new Date().toISOString(); saveMeta();
    toast('Офлайн-сайт с записями скачан');
  } else toast('Браузер не дал скачать файл. Попробуй резервную копию .json');
}
function download(name, text, type) {
  try {
    const blob = new Blob([text], { type: type + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    return true;
  } catch (e) { return false; }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
function parseBackup(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return null; }
  const items = Array.isArray(d) ? d : d && Array.isArray(d.items) ? d.items : null;
  if (!items) return null;
  const ok = items.map(x => norm(Object.assign({}, x))).filter(Boolean);
  return ok.length ? { items: ok, exported: d.exported || '' } : null;
}

document.addEventListener('click', e => {

document.addEventListener('submit', e => { if (e.target.id === 'addform') { e.preventDefault(); submitAdd(e.target); } });
document.addEventListener('change', e => {

  }

    else tgt.dates.push(v);
    tgt.dates.sort();

    Store.touch(it);

document.addEventListener('change', e => {

function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 320) + 'px'; }
let qT = null;

/* ================= Тема ================= */
function applyTheme() {
  const t = LS.get(KEY_THEME, 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

/* ================= Запуск ================= */
function readSeed() {
  const el = $('#seed');
  const txt = el ? el.textContent.trim() : '';
  if (!txt) return { items: [] };
  try { const d = JSON.parse(txt); return { items: (d.items || []).map(norm).filter(Boolean), exported: d.exported || '' }; } catch (e) { return { items: [] }; }
}
function boot2() {
  S.ready = true;
  const r = parseHash();
  UI.view = r.v;
  renderShell();
  setSave('ok');
  renderNav(); renderMain();
  if (r.id && S.byId.has(r.id)) { UI.open = r.id; renderDrawer(); markActiveRow(); }
}
function readConnect() {
  const m = location.hash.match(/connect=([A-Za-z0-9_\-]+)/);
  if (!m) return;
  try {
    const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const j = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
    if (j.u && j.k) LS.set(KEY_REMOTE, { url: j.u, key: j.k });
  } catch (e) {}
  try { history.replaceState(null, '', location.pathname + '#home'); } catch (e) {}
}
function connectLink() {
  const r = LS.get(KEY_REMOTE, null); if (!r) return '';
  const b = btoa(unescape(encodeURIComponent(JSON.stringify({ u: r.url, k: r.key })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#connect=' + b;
}
function connectScreen() {
  $('#app').innerHTML = '<div class="loading" style="padding:24px"><form id="connectform" style="max-width:520px;text-align:left;display:grid;gap:14px;color:var(--ink)">' +
    '<div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">Кинодневник</span></div>' +
    '<h1 class="h1">Подключи свой дневник</h1>' +
    '<p class="muted" style="margin:0">На этом устройстве дневник ещё не знает, где лежат твои записи. Проще всего открыть ссылку подключения: она есть в разделе «Данные» на устройстве, где дневник уже работает. Или вставь адрес и ключ вручную.</p>' +
    '<label class="field"><span>Адрес таблицы (заканчивается на /exec)</span><input class="input" name="url" required placeholder="https://script.google.com/macros/s/…/exec"></label>' +
    '<label class="field"><span>Ключ</span><input class="input" name="key" required autocomplete="off"></label>' +
    '<div class="row-acts"><button class="btn primary" type="submit">Подключить</button></div></form></div>';
  $('#connectform').addEventListener('submit', e => {
    e.preventDefault(); const f = new FormData(e.target);
    LS.set(KEY_REMOTE, { url: String(f.get('url')).trim(), key: String(f.get('key')).trim() }); location.reload();
  });
}
async function boot() {

  if (isGoogle() || LS.get(KEY_REMOTE, null)) {
    $('#app').innerHTML = '<div class="loading"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">Кинодневник</span></div><p>Загружаю записи из Google-таблицы…</p></div>';
    let items;
    try { items = await Store.load(); }
    catch (e) {
      $('#app').innerHTML = '<div class="loading"><div class="h2">Не получилось открыть таблицу</div><p class="muted">' + esc(e && e.message || 'Проверь интернет и обнови страницу.') + '</p></div>';
