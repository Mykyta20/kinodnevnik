/* ================= Итоги года: финальные титры ================= */
const MONTHS_NOM = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const BEST_LABEL = { film: 'Фильм года', series: 'Сериал года', cartoon: 'Мультфильм года', anime: 'Аниме года' };
const CR = { open: false, y: '', pos: 0, max: 0, speed: 46, play: true, last: 0, raf: 0, idle: 0, pushed: false, ro: null };
const yearsWithViews = () => Array.from(new Set(viewEvents().map(e => e.d.slice(0, 4)))).sort().reverse();
const dayMonth = iso => +iso.slice(8, 10) + ' ' + MONTHS_GEN[+iso.slice(5, 7) - 1];
function yearStats(y) {
  const ev = viewEvents().filter(e => e.d.startsWith(y));
  const byG = { film: 0, series: 0, cartoon: 0, anime: 0 }, months = Array(12).fill(0), seen = new Map();
  ev.forEach(e => {
    byG[e.g]++; months[+e.d.slice(5, 7) - 1]++;
    const s = seen.get(e.it.id); if (s) s.n++; else seen.set(e.it.id, { it: e.it, n: 1, first: e.d, label: e.label });
  });
  const titles = Array.from(seen.values());
  const top1 = (arr, min) => { const m = new Map(); arr.forEach(x => { if (x) m.set(x, (m.get(x) || 0) + 1); }); const t = Array.from(m.entries()).sort((a, b) => b[1] - a[1])[0]; return t && t[1] >= min ? t : null; };
  const best = {};
  GROUP_ORDER.forEach(g => { best[g] = titles.filter(t => groupOf(t.it) === g && t.it.rating).sort((a, b) => b.it.rating - a.it.rating || lastDate(b.it).localeCompare(lastDate(a.it)))[0] || null; });
  const dubs = [];
  S.items.forEach(it => {
    if (isMulti(it)) it.parts.forEach(p => (p.dates || []).forEach(d => { if (d.startsWith(y)) dubs.push(String(p.dub || it.dub || '').trim()); }));
    else it.dates.forEach(d => { if (d.startsWith(y)) dubs.push(String(it.dub || '').trim()); });
  });
  const rated = titles.filter(t => t.it.rating), mins = ev.filter(e => !isSeriesLike(e.it) && e.it.info && e.it.info.rt).map(e => e.it.info.rt);
  return {
    ev, byG, months, titles, best,
    top: titles.filter(t => t.it.rating >= 8).sort((a, b) => b.it.rating - a.it.rating || (b.it.img ? 1 : 0) - (a.it.img ? 1 : 0) || a.first.localeCompare(b.first)).slice(0, 6),
    genre: top1(titles.flatMap(t => ((t.it.info && t.it.info.g) || []).map(s => String(s).toLowerCase())), 3),
    dir: top1(titles.filter(t => !isAnimeLike(t.it) && !isSeriesLike(t.it)).flatMap(t => t.it.info && t.it.info.dir ? t.it.info.dir.split(', ') : []), 2),
    dub: top1(dubs, 2),
    avg: rated.length ? rated.reduce((a, t) => a + t.it.rating, 0) / rated.length : 0,
    rew: titles.filter(t => t.n > 1).sort((a, b) => b.n - a.n),
    hours: mins.length >= 3 ? Math.round(mins.reduce((a, b) => a + b, 0) / 60) : 0,
    peak: months.indexOf(Math.max(...months)),
    dropped: titles.filter(t => t.it.status === 'dropped').length
  };
}

  if (first) facts.push(row('Первый сеанс', esc(first.label) + ' <em>' + dayMonth(first.d) + '</em>'));

function crMeasure() {

function crStep(t) {

function download(name, text, type) {
  try {
    const blob = new Blob([text], { type: type + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);

  } catch (e) { return false; }
}

    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}

  let d; try { d = JSON.parse(text); } catch (e) { return null; }
  const items = Array.isArray(d) ? d : d && Array.isArray(d.items) ? d.items : null;
  if (!items) return null;
  const ok = items.filter(x => x && x.id !== CFG_ID).map(x => norm(Object.assign({}, x))).filter(Boolean);
  return ok.length ? { items: ok, exported: d.exported || '' } : null;
}

document.addEventListener('keydown', e => {

  }

  }

});

/* ================= Тема ================= */
function applyTheme() {
  const t = LS.get(KEY_THEME, 'dark');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0F0D0C');

/* свет проектора: мягкое пятно идёт за курсором */
function mountHall() {
  if ($('.hall')) return;
  document.body.insertAdjacentHTML('afterbegin', '<div class="hall" aria-hidden="true"></div>');
  const hall = $('.hall');
  let raf = 0, x = 0, y = 0;

}

/* ================= Запуск ================= */
function readSeed() {
  const el = $('#seed');
  const txt = el ? el.textContent.trim() : '';
  if (!txt) return { items: [] };
  try { const d = JSON.parse(txt); return { items: (d.items || []).filter(x => x && x.id !== CFG_ID).map(norm).filter(Boolean), exported: d.exported || '' }; } catch (e) { return { items: [] }; }
}
function boot2() {
  S.ready = true;

  UI.view = r.v;

  setSave('ok');

  if (r.id && S.byId.has(r.id)) { UI.open = r.id; renderDrawer(); markActiveRow(); }
  if (location.hash === '#rate') openQR();

function readConnect() {

  try {
    const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const j = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
    if (j.u && j.k) LS.set(KEY_REMOTE, { url: j.u, key: j.k });
  } catch (e) {}

}
function connectLink() {
  const r = LS.get(KEY_REMOTE, null); if (!r) return '';

function connectScreen() {

    '<div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">Кинодневник</span></div>' +
    '<h1 class="h1">Подключи свой дневник</h1>' +
    '<p class="muted" style="margin:0">На этом устройстве дневник ещё не знает, где лежат твои записи. Проще всего открыть ссылку подключения: она есть в разделе «Данные» на устройстве, где дневник уже работает. Или вставь адрес и ключ вручную.</p>' +
    '<label class="field"><span>Адрес таблицы (заканчивается на /exec)</span><input class="input" name="url" required placeholder="https://script.google.com/macros/s/…/exec"></label>' +

async function boot() {

      '<div class="brand" style="justify-content:center"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">Кинодневник</span></div><p>Загружаю записи из Google-таблицы…</p></div></div>';
